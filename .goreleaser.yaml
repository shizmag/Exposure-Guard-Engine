version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: exposureguard-core
    main: ./cmd/exposureguard
    binary: exposureguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - >-
        -X
        github.com/exposureguard/exposureguard/internal/buildinfo.Version={{
        .Version }}
      - >-
        -X
        github.com/exposureguard/exposureguard/internal/buildinfo.GitCommit={{
        .Commit }}
      - >-
        -X
        github.com/exposureguard/exposureguard/internal/buildinfo.BuildDate={{
        .Date }}

release:
  extra_files:
    - glob: "dist/release-artifacts/exposureguard_{{ .Version }}_*.tar.gz"

archives:
  - id: core
    ids: [exposureguard-core]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_core
    files:
      - none*
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "SHA256SUMS"

sboms:
  - artifacts: archive
    id: archive-sbom
  - artifacts: binary
    id: binary-sbom

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
